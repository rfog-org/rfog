# RELAY — v0 1v1 map, 20x12. Symmetric under 180 degree rotation.
#
# terrain legend:  . open   # wall   c cover   o objective
# elevation legend:   0-3 = z
#
# Features: central raised block (z1 ring, z2 core) holding the CORE objective;
# two side objectives in the contested middle third, each nearer one side but
# reachable by both, so no objective is free; walls at the north and south
# edges force traffic into two lanes (y=3 and y=8); the rows y=0 and y=11 are
# low-ground gutters below the ridges.

