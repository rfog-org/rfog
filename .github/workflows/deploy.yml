# rfog.org is the game server: it serves the web app, the game protocol and
# SSH play from one binary. Every push to main tests, builds and installs
# that binary on the server, then restarts it. Branches other than main
# never deploy. Until the secrets below exist, the deploy steps are skipped.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         the server's address (rfog.org or its static IP)
#   DEPLOY_KEY          the private half of the deploy SSH key
#   DEPLOY_KNOWN_HOSTS  the server's host key line (ssh-keyscan -t ed25519 HOST)
# Optional repository variable:
#   DEPLOY_ARCH         amd64 (default) or arm64
# SERVER.md sets up the matching "deploy" user on the server.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build the server
        env:
          GOARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
        run: |
          make web
          GOOS=linux CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o rfog-server ./cmd/rfog
      - name: Check for deploy secrets
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "ok=$([ -n "$HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install on the server and restart
        if: steps.ready.outputs.ok == 'yes'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy rfog-server "deploy@$HOST:rfog.new"
          ssh -i ~/.ssh/deploy "deploy@$HOST" sudo /usr/local/bin/rfog-update
      - name: Check the site answers
        if: steps.ready.outputs.ok == 'yes'
        run: |
          sleep 5
          curl -fsS -o /dev/null https://rfog.org/ && echo "rfog.org is up"
