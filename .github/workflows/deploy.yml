# rfog.org is the game server: it serves the web app, the game protocol and
# SSH play from one binary. Every push to main tests, builds and installs
# that binary on the server, then restarts it. Branches other than main
# never deploy. Until the secrets below exist, the deploy steps are skipped.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         the server's address (rfog.org or its static IP)
#   DEPLOY_KEY          the private half of the deploy SSH key
#   DEPLOY_KNOWN_HOSTS  the server's host key line (ssh-keyscan -t ed25519 HOST)
# Optional repository variable:
#   DEPLOY_ARCH         amd64 (default) or arm64
# SERVER.md sets up the matching "deploy" user on the server.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build the server
        env:
          GOARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
        run: |
          make web
          GOOS=linux CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=main-${GITHUB_SHA::7}" -o rfog-server ./cmd/rfog
      - name: Check for deploy secrets
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "ok=$([ -n "$HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install on the server and restart
        if: steps.ready.outputs.ok == 'yes'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "DEPLOY_KEY: ${#KEY} characters received (0 = the secret is missing or misnamed)"
          # DEPLOY_KEY is the private key file, pasted as is or as one base64
          # line (base64 -i ~/.ssh/rfog-deploy | tr -d '\n'), which survives
          # pasting; Windows line endings are dropped either way.
          if printf '%s' "$KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy
          else
            printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy
          fi
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null || { echo "DEPLOY_KEY is not a valid private key"; exit 1; }
          printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy rfog-server "deploy@$HOST:rfog.new"
          ssh -i ~/.ssh/deploy "deploy@$HOST" sudo /usr/local/bin/rfog-update
      - name: Check the site answers
        if: steps.ready.outputs.ok == 'yes'
        run: |
          sleep 5
          curl -fsS -o /dev/null https://rfog.org/ && echo "rfog.org is up"
