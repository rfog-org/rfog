<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RFoG, "RF over glass": a signal node on a line of glass fibre, its
       waves going out above and their reflection in the glass below. -->
  <rect width="64" height="64" rx="14" fill="#0b0c0e"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1e2125" stroke-width="2"/>
  <path d="M22 34 A10 10 0 0 1 42 34" fill="none" stroke="#4fd3e8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M13 34 A19 19 0 0 1 51 34" fill="none" stroke="#4fd3e8" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M22 38 A10 10 0 0 0 42 38" fill="none" stroke="#4fd3e8" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 38 A19 19 0 0 0 51 38" fill="none" stroke="#4fd3e8" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round"/>
  <line x1="7" y1="36" x2="57" y2="36" stroke="#4fd3e8" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="5" fill="#4fd3e8"/>
  <circle cx="32" cy="36" r="2" fill="#e8fbff"/>
</svg>
